<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Клановый обмен предметами</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: #1a1d24;
    color: #e6e6e6;
    margin: 0;
    padding: 30px 20px;
  }
  h1 {
    text-align: center;
    color: #ffcc66;
    margin-bottom: 25px;
    text-shadow: 0 0 12px rgba(255,204,102,.4);
  }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  button {
    background: #2c3140;
    color: #e6e6e6;
    border: 1px solid #3f4657;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
  }
  button:hover { background: #3a4152; border-color: #ffcc66; }
  button.danger { border-color: #7a2e2e; color: #ff9b9b; }
  button.danger:hover { background: #4a1f1f; }
  button.add { background: #2e5a3a; border-color: #4caf50; }
  button.add:hover { background: #3a7048; }
  button.save-btn { background: #3a5a8a; border-color: #4a7ec8; }
  button.save-btn:hover { background: #4a6ea8; }

  .counter {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 15px;
  }

  .info-bar {
    max-width: 1250px;
    margin: 0 auto 15px;
    background: #2a2f1e;
    border: 1px solid #5a6b3a;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    color: #c8d9a0;
    text-align: center;
  }

  table {
    width: 100%;
    max-width: 1250px;
    margin: 0 auto;
    border-collapse: collapse;
    background: #232733;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  th {
    background: #2c3140;
    color: #ffcc66;
    padding: 14px 12px;
    text-align: left;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 2px solid #3f4657;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid #2e3342;
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #282d3b; }

  input, textarea {
    width: 100%;
    background: #1a1d24;
    border: 1px solid #3f4657;
    color: #e6e6e6;
    padding: 8px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #ffcc66;
    box-shadow: 0 0 0 2px rgba(255,204,102,.15);
  }
  input[type="date"] { color-scheme: dark; }
  textarea { min-height: 60px; }

  .items-cell { min-width: 360px; }
  .actions { width: 90px; text-align: center; }
  .num { width: 50px; text-align: center; color: #888; }

  .item-row {
    display: grid;
    grid-template-columns: 1fr 150px auto auto;
    gap: 6px;
    margin-bottom: 6px;
    align-items: center;
  }
  .item-row .del-item {
    background: transparent;
    border: none;
    color: #ff7a7a;
    font-size: 18px;
    cursor: pointer;
    padding: 0 6px;
    line-height: 1;
  }
  .item-row .del-item:hover { color: #ff4444; }
  .item-row .today-btn {
    background: #2c3140;
    border: 1px solid #3f4657;
    color: #ffcc66;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item-row .today-btn:hover { background: #3a4152; }
  .add-item {
    font-size: 12px;
    padding: 5px 10px;
    background: #2c3140;
    border-radius: 6px;
    margin-top: 4px;
  }
  .empty-hint {
    text-align: center;
    color: #777;
    padding: 40px;
    font-style: italic;
  }
  .items-header {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 6px;
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 4px;
    padding: 0 2px;
  }
  .search-bar {
    max-width: 1250px;
    margin: 0 auto 15px;
    display: flex;
    gap: 10px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    font-size: 15px;
  }
</style>
</head>
<body>

<h1>⚔️ Клановый обмен предметами</h1>

<div class="info-bar">
  ✏️ Редактируйте таблицу → нажмите <b>💾 Сохранить в HTML</b> → браузер скачает обновлённый файл, который можно отправлять другим.
</div>

<div class="toolbar">
  <button class="add" onclick="addMember()">＋ Добавить участника</button>
  <button onclick="sortAlphabetically()">🔤 Сортировать по алфавиту</button>
  <button class="save-btn" onclick="saveToHTML()">💾 Сохранить в HTML</button>
  <button onclick="downloadJSON()">📤 Экспорт JSON</button>
  <button onclick="document.getElementById('importFile').click()">📥 Импорт JSON</button>
  <input type="file" id="importFile" accept=".json" hidden onchange="importJSON(event)">
  <button class="danger" onclick="clearAll()">🗑 Очистить всё</button>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Поиск по нику или предмету..." oninput="filterTable()">
</div>

<div class="counter" id="counter"></div>

<table>
  <thead>
    <tr>
      <th class="num">#</th>
      <th style="width:180px">Никнейм</th>
      <th style="width:130px">Роль</th>
      <th class="items-cell">Полученные предметы и даты</th>
      <th style="width:160px">Заметки</th>
      <th class="actions">Действия</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

// Текущие данные (могут отличаться от встроенных, пока не сохранены в HTML)
let clanData = JSON.parse(JSON.stringify(EMBEDDED_DATA));

function today() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

const tbody = document.getElementById('tbody');

function updateCounter() {
  const total = clanData.length;
  const totalItems = clanData.reduce((sum, m) => sum + (m.items?.length || 0), 0);
  document.getElementById('counter').textContent =
    `Участников: ${total}   •   Всего предметов: ${totalItems}`;
}

function sortAlphabetically() {
  clanData.sort((a, b) =>
    (a.name || '').localeCompare(b.name || '', 'ru', { sensitivity: 'base' })
  );
  render();
}

function render() {
  tbody.innerHTML = '';

  if (clanData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-hint">Список пуст. Добавьте первого участника.</td></tr>`;
    updateCounter();
    return;
  }

  clanData.forEach((member, idx) => {
    const tr = document.createElement('tr');
    tr.dataset.search = (member.name + ' ' + member.role + ' ' +
      (member.items || []).map(i => i.name).join(' ') + ' ' + (member.notes || '')).toLowerCase();

    const tdNum = document.createElement('td');
    tdNum.className = 'num';
    tdNum.textContent = idx + 1;
    tr.appendChild(tdNum);

    const tdName = document.createElement('td');
    const inpName = document.createElement('input');
    inpName.value = member.name;
    inpName.placeholder = 'Ник';
    inpName.oninput = e => {
      member.name = e.target.value;
      tr.dataset.search = (member.name + ' ' + member.role + ' ' +
        (member.items || []).map(i => i.name).join(' ') + ' ' + (member.notes || '')).toLowerCase();
      updateCounter();
    };
    tdName.appendChild(inpName);
    tr.appendChild(tdName);

    const tdRole = document.createElement('td');
    const inpRole = document.createElement('input');
    inpRole.value = member.role;
    inpRole.placeholder = 'Роль';
    inpRole.oninput = e => { member.role = e.target.value; };
    tdRole.appendChild(inpRole);
    tr.appendChild(tdRole);

    const tdItems = document.createElement('td');
    tdItems.className = 'items-cell';

    const header = document.createElement('div');
    header.className = 'items-header';
    header.innerHTML = `<span>Предмет</span><span>Дата получения</span>`;
    tdItems.appendChild(header);

    const itemsWrap = document.createElement('div');
    renderItems(member, itemsWrap);
    tdItems.appendChild(itemsWrap);

    const btnAddItem = document.createElement('button');
    btnAddItem.className = 'add-item';
    btnAddItem.textContent = '＋ предмет';
    btnAddItem.onclick = () => {
      member.items.push({ name: '', date: today() });
      renderItems(member, itemsWrap);
      updateCounter();
    };
    tdItems.appendChild(btnAddItem);
    tr.appendChild(tdItems);

    const tdNotes = document.createElement('td');
    const taNotes = document.createElement('textarea');
    taNotes.value = member.notes || '';
    taNotes.placeholder = 'Заметка...';
    taNotes.oninput = e => { member.notes = e.target.value; };
    tdNotes.appendChild(taNotes);
    tr.appendChild(tdNotes);

    const tdAct = document.createElement('td');
    tdAct.className = 'actions';
    const btnDel = document.createElement('button');
    btnDel.className = 'danger';
    btnDel.textContent = '✕';
    btnDel.title = 'Удалить участника';
    btnDel.onclick = () => {
      if (confirm(`Удалить "${member.name || 'без имени'}"?`)) {
        clanData.splice(idx, 1);
        render();
      }
    };
    tdAct.appendChild(btnDel);
    tr.appendChild(tdAct);

    tbody.appendChild(tr);
  });

  updateCounter();
}

function renderItems(member, container) {
  container.innerHTML = '';
  if (member.items.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:#666;font-size:13px;margin-bottom:6px;';
    empty.textContent = 'нет предметов';
    container.appendChild(empty);
  }
  member.items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const inp = document.createElement('input');
    inp.value = item.name;
    inp.placeholder = 'Название предмета';
    inp.oninput = e => { item.name = e.target.value; };

    const dateInp = document.createElement('input');
    dateInp.type = 'date';
    dateInp.value = item.date || '';
    dateInp.onchange = e => { item.date = e.target.value; };

    const todayBtn = document.createElement('button');
    todayBtn.className = 'today-btn';
    todayBtn.textContent = 'Сегодня';
    todayBtn.onclick = () => {
      item.date = today();
      dateInp.value = item.date;
    };

    const del = document.createElement('button');
    del.className = 'del-item';
    del.textContent = '✕';
    del.title = 'Удалить предмет';
    del.onclick = () => {
      member.items.splice(i, 1);
      renderItems(member, container);
      updateCounter();
    };

    row.appendChild(inp);
    row.appendChild(dateInp);
    row.appendChild(todayBtn);
    row.appendChild(del);
    container.appendChild(row);
  });
}

function addMember() {
  clanData.push({ name: '', role: 'Участник', items: [], notes: '' });
  render();
}

function clearAll() {
  if (confirm('Удалить всех участников? Действие необратимо.')) {
    clanData = [];
    render();
  }
}

function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('#tbody tr').forEach(tr => {
    if (!tr.dataset.search) return;
    tr.style.display = (!q || tr.dataset.search.includes(q)) ? '' : 'none';
  });
}

// ====== СОХРАНЕНИЕ В HTML ======
function saveToHTML() {
  const html = document.documentElement.outerHTML;
  const newData = JSON.stringify(clanData, null, 2);
  const regex = /const EMBEDDED_DATA = \[[\s\S]*?\];/;
  const replacement = `const EMBEDDED_DATA = ${newData};`;

  if (!regex.test(html)) {
    alert('Не удалось найти блок данных в файле. Сохраните страницу вручную (Ctrl+S).');
    return;
  }

  let newHtml = html.replace(regex, replacement);

  if (!/^<!DOCTYPE html>/i.test(newHtml)) {
    newHtml = '<!DOCTYPE html>\n' + newHtml;
  }

  const blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clan.html';
  a.click();
  URL.revokeObjectURL(url);

  setTimeout(() => {
    alert(
      '✅ Файл clan.html сохранён с вашими данными.\n\n' +
      'Теперь его можно отправить другому человеку — ' +
      'при открытии он увидит всю таблицу.'
    );
  }, 200);
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(clanData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clan_data.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        clanData = data.map(m => ({
          name: m.name || '',
          role: m.role || 'Участник',
          items: (m.items || []).map(it =>
            typeof it === 'string' ? { name: it, date: '' } : {
              name: it.name || '',
              date: it.date || ''
            }
          ),
          notes: m.notes || ''
        }));
        render();
        alert('✅ Данные загружены. Не забудьте нажать «💾 Сохранить в HTML».');
      } else alert('Неверный формат файла');
    } catch { alert('Ошибка чтения JSON'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

render();
</script>
</body>
</html>
